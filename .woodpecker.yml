steps:
  test:
    image: ghcr.io/astral-sh/uv:0.11.14-python3.13-alpine3.23
    commands:
      - uv sync --frozen --extra testing
      - uv run coverage run -m pytest
      - uv run coverage report -m
      - uv run coverage xml
    when:
      branch: main
      event: [push, pull_request]

  codecov:
    image: woodpeckerci/plugin-codecov:2.3.1
    settings:
      files:
        - coverage.xml
      token:
        from_secret: codecov_token
    when:
      branch: main
      event: [push, pull_request]
